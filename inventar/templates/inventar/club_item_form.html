{% extends "inventar/base.html" %}
{% block title %}{{ item }} – Börse EC Thun{% endblock %}
{% block content %}
<h1>{{ item }}</h1>
<form method="post" class="form">
  {% csrf_token %}
  <div class="form-grid">
    {% for field in form %}
      <div class="field{% if field.errors %} has-error{% endif %}"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>
    {% endfor %}
  </div>
  <div class="actions"><button type="submit" class="primary">Speichern</button><a href="{% url 'club_items' %}">Abbrechen</a></div>
</form>
{% endblock %}
