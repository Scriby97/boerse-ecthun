# Bei jedem Push: Tests. Danach die Mac-App bauen und mit dem Selbsttest prüfen.
# Bei einem Tag wie v1.0.0 kommt die App als DMG und ZIP in ein GitHub-Release (DMG für die erste
# Installation, ZIP für den Update-Knopf in der App).
name: Tests und Mac-App

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py test

  mac:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: apple-chip
          - runner: macos-15-intel
            arch: intel
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-desktop.txt pyinstaller pillow
      - run: pyinstaller --noconfirm boerse.spec
      # Fehler kommen als Annotation in die Übersicht (ohne Anmelden lesbar): annotate <Titel> <Logdatei>
      - name: Hilfsfunktion für Fehlermeldungen
        run: |
          cat > "$RUNNER_TEMP/annotate.sh" <<'SH'
          echo "::error title=$1::$(tail -c 3500 "$2" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          SH
      # Zuerst testen: danach darf sich am App-Paket nichts mehr ändern, sonst stimmt die Signatur nicht
      - name: Selbsttest der fertigen App
        run: |
          set -o pipefail
          if ! "dist/Börse EC Thun.app/Contents/MacOS/Börse EC Thun" --selftest 2>&1 | tee selftest.log; then
            sh "$RUNNER_TEMP/annotate.sh" Selbsttest selftest.log; exit 1
          fi
      # Die Programmteile signiert PyInstaller; hier wird das ganze Paket versiegelt (ad hoc). Ist die Signatur
      # gültig, meldet macOS nach dem Herunterladen nicht «beschädigt», sondern «nicht überprüft» – und die App
      # lässt sich in den Systemeinstellungen mit «Dennoch öffnen» freigeben, ohne Terminal.
      - name: App versiegeln (ad hoc)
        run: |
          APP="dist/Börse EC Thun.app"
          xattr -cr "$APP"
          # Python.framework kommt mit einer Signatur, die Dateien verlangt, die PyInstaller nicht mitkopiert
          codesign --force --sign - "$APP/Contents/Frameworks/Python.framework" > sign.log 2>&1 || true
          if ! { codesign --force --sign - "$APP" && codesign --verify --deep --strict --verbose=2 "$APP"; } >> sign.log 2>&1; then
            cat sign.log; sh "$RUNNER_TEMP/annotate.sh" Versiegeln sign.log; exit 1
          fi
          cat sign.log
      # ZIP für den Update-Knopf in der App, DMG (Fenster zum Rüberziehen) für die erste Installation
      - name: ZIP und DMG erstellen
        run: |
          cd dist
          ditto -c -k --keepParent "Börse EC Thun.app" "Boerse-EC-Thun-${{ matrix.arch }}.zip"
          mkdir dmg
          ditto "Börse EC Thun.app" "dmg/Börse EC Thun.app"
          ln -s /Applications dmg/Programme
          for try in 1 2 3; do
            hdiutil create -volname "Börse EC Thun" -srcfolder dmg -ov -format UDZO "Boerse-EC-Thun-${{ matrix.arch }}.dmg" && break
            sleep 5
          done
          test -f "Boerse-EC-Thun-${{ matrix.arch }}.dmg"
      - name: Signatur nach dem Auspacken prüfen
        run: |
          mkdir -p "$RUNNER_TEMP/zip" && ditto -x -k "dist/Boerse-EC-Thun-${{ matrix.arch }}.zip" "$RUNNER_TEMP/zip"
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" "dist/Boerse-EC-Thun-${{ matrix.arch }}.dmg"
          ok=0
          for app in "$RUNNER_TEMP/zip/Börse EC Thun.app" "$RUNNER_TEMP/dmg/Börse EC Thun.app"; do
            codesign --verify --deep --strict --verbose=2 "$app" >> verify.log 2>&1 || ok=1
          done
          hdiutil detach "$RUNNER_TEMP/dmg"
          cat verify.log
          if [ $ok -ne 0 ]; then sh "$RUNNER_TEMP/annotate.sh" "Signatur nach dem Auspacken" verify.log; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: Boerse-EC-Thun-${{ matrix.arch }}
          path: |
            dist/Boerse-EC-Thun-${{ matrix.arch }}.zip
            dist/Boerse-EC-Thun-${{ matrix.arch }}.dmg
      - name: An das Release hängen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Boerse-EC-Thun-${{ matrix.arch }}.zip
            dist/Boerse-EC-Thun-${{ matrix.arch }}.dmg
