# Bei jedem Push: Tests. Danach die Mac-App bauen und mit dem Selbsttest prüfen.
# Bei einem Tag wie v1.0.0 kommt die App als ZIP in ein GitHub-Release (dort lädt Stephanie sie herunter).
name: Tests und Mac-App

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py test

  mac:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: apple-chip
          - runner: macos-15-intel
            arch: intel
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-desktop.txt pyinstaller pillow
      - run: pyinstaller --noconfirm boerse.spec
      - name: Selbsttest der fertigen App
        run: '"dist/Börse EC Thun.app/Contents/MacOS/Börse EC Thun" --selftest'
      - name: ZIP erstellen
        run: |
          cd dist
          ditto -c -k --keepParent "Börse EC Thun.app" "Boerse-EC-Thun-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Boerse-EC-Thun-${{ matrix.arch }}
          path: dist/Boerse-EC-Thun-${{ matrix.arch }}.zip
      - name: An das Release hängen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Boerse-EC-Thun-${{ matrix.arch }}.zip
