# Bei jedem Push: Tests. Danach die Mac-App bauen und mit dem Selbsttest prüfen.
# Bei einem Tag wie v1.0.0 kommt die App als DMG und ZIP in ein GitHub-Release (DMG für die erste
# Installation, ZIP für den Update-Knopf in der App).
name: Tests und Mac-App

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py test

  mac:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: apple-chip
          - runner: macos-15-intel
            arch: intel
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-desktop.txt pyinstaller pillow
      - run: pyinstaller --noconfirm boerse.spec
      # Fehler kommen als Annotation in die Übersicht (ohne Anmelden lesbar): annotate <Titel> <Logdatei>
      - name: Hilfsfunktion für Fehlermeldungen
        run: |
          cat > "$RUNNER_TEMP/annotate.sh" <<'SH'
          echo "::error title=$1::$(tail -c 3500 "$2" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          SH
      - name: Signatur nach PyInstaller (nur zur Info)
        run: |
          codesign --verify --deep --strict --verbose=4 "dist/Börse EC Thun.app" 2>&1 | grep -v -E '^--(prepared|validated)' > pyi.log || true
          cat pyi.log
          echo "::notice title=Signatur nach PyInstaller::$(tail -c 3000 pyi.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
      # Zuerst testen: danach darf sich am App-Paket nichts mehr ändern, sonst stimmt die Signatur nicht
      - name: Selbsttest der fertigen App
        run: |
          set -o pipefail
          if ! "dist/Börse EC Thun.app/Contents/MacOS/BoerseECThun" --selftest 2>&1 | tee selftest.log; then
            sh "$RUNNER_TEMP/annotate.sh" Selbsttest selftest.log; exit 1
          fi
      # Die Programmteile signiert PyInstaller; hier wird das ganze Paket versiegelt (ad hoc). Ist die Signatur
      # gültig, meldet macOS nach dem Herunterladen nicht «beschädigt», sondern «nicht überprüft» – und die App
      # lässt sich in den Systemeinstellungen mit «Dennoch öffnen» freigeben, ohne Terminal.
      - name: App versiegeln (ad hoc)
        run: |
          APP="dist/Börse EC Thun.app"
          xattr -cr "$APP"
          # Python.framework kommt mit einer Signatur, die Dateien verlangt, die PyInstaller nicht mitkopiert
          codesign --force --sign - "$APP/Contents/Frameworks/Python.framework" > sign.log 2>&1 || true
          if ! { codesign --force --sign - "$APP" && codesign --verify --deep --strict --verbose=4 "$APP"; } >> sign.log 2>&1; then
            grep -v -E '^--(prepared|validated)' sign.log > sign.err || true
            {
              echo "== ohne --deep"; codesign --verify --strict -vvvv "$APP" 2>&1 | grep -v -E '^--(prepared|validated)' | tail -15
              echo "== Framework"; codesign --verify --strict -vvvv "$APP/Contents/Frameworks/Python.framework" 2>&1 | tail -8
              echo "== Aufbau"; ls -la "$APP/Contents/Frameworks/Python.framework" "$APP/Contents/Frameworks/Python.framework/Versions" "$APP/Contents/Frameworks/Python.framework/Versions/Current/" 2>&1
              echo "== Symlinks nach aussen"; find "$APP" -type l -exec sh -c 'case "$(readlink "$1")" in /*) echo "$1 -> $(readlink "$1")";; esac' _ {} \; | head -10
            } >> sign.err 2>&1
            cat sign.err; sh "$RUNNER_TEMP/annotate.sh" Versiegeln sign.err; exit 1
          fi
          grep -v -E '^--(prepared|validated)' sign.log || true
      # ZIP für den Update-Knopf in der App, DMG (Fenster zum Rüberziehen) für die erste Installation
      # ZIP: für den Update-Knopf in der App und als Vorlage für das DMG (eigener Schritt unten)
      - name: ZIP erstellen und prüfen
        run: |
          ditto -c -k --keepParent "dist/Börse EC Thun.app" "dist/Boerse-EC-Thun-${{ matrix.arch }}.zip"
          mkdir -p "$RUNNER_TEMP/zip" && ditto -x -k "dist/Boerse-EC-Thun-${{ matrix.arch }}.zip" "$RUNNER_TEMP/zip"
          if ! codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/zip/Börse EC Thun.app" > verify.log 2>&1; then
            cat verify.log; sh "$RUNNER_TEMP/annotate.sh" "Signatur nach dem Auspacken" verify.log; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Boerse-EC-Thun-${{ matrix.arch }}-zip
          path: dist/Boerse-EC-Thun-${{ matrix.arch }}.zip
      - name: An das Release hängen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Boerse-EC-Thun-${{ matrix.arch }}.zip

  # Installationsfenster (DMG) für beide Chips. Alles auf dem Apple-Chip-Rechner: auf dem Intel-Rechner stürzt
  # dmgbuild ab (mac_alias: zu grosse Dateinummern). Die App darin ist unverändert die signierte aus dem ZIP.
  dmg:
    needs: mac
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Boerse-EC-Thun-*-zip
          merge-multiple: true
          path: zips
      - name: DMG erstellen und prüfen
        run: |
          pip install dmgbuild
          # Hintergrund mit Pfeil für normale und Retina-Bildschirme
          tiffutil -cathidpicheck scripts/dmg/background.png scripts/dmg/background@2x.png -out "$RUNNER_TEMP/background.tiff"
          mkdir -p dist
          for arch in apple-chip intel; do
            mkdir -p "$RUNNER_TEMP/$arch" && ditto -x -k "zips/Boerse-EC-Thun-$arch.zip" "$RUNNER_TEMP/$arch"
            dmgbuild -s scripts/dmg_settings.py -D app="$RUNNER_TEMP/$arch/Börse EC Thun.app" -D background="$RUNNER_TEMP/background.tiff" "Börse EC Thun" "dist/Boerse-EC-Thun-$arch.dmg"
            hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/mnt-$arch" "dist/Boerse-EC-Thun-$arch.dmg"
            codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/mnt-$arch/Börse EC Thun.app"
            hdiutil detach "$RUNNER_TEMP/mnt-$arch"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Boerse-EC-Thun-dmg
          path: dist/*.dmg
      - name: An das Release hängen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
