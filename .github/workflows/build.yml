# Bei jedem Push: Tests. Danach die Mac-App bauen und mit dem Selbsttest prüfen.
# Bei einem Tag wie v1.0.0 kommt die App als ZIP in ein GitHub-Release (dort lädt Stephanie sie herunter).
name: Tests und Mac-App

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py test

  mac:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: apple-chip
          - runner: macos-15-intel
            arch: intel
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-desktop.txt pyinstaller pillow
      - run: pyinstaller --noconfirm boerse.spec
      # Die einzelnen Programmteile signiert PyInstaller; hier wird das ganze Paket versiegelt (ad hoc),
      # damit macOS es nach dem Herunterladen nicht als «beschädigt» meldet. Scheitert das, entsteht die App trotzdem.
      - name: App versiegeln (ad hoc)
        continue-on-error: true
        run: |
          codesign --force --sign - "dist/Börse EC Thun.app"
          codesign --verify --strict --verbose=2 "dist/Börse EC Thun.app"
      # Bei einem Fehler kommt das Ende der Ausgabe als Annotation in die Übersicht (ohne Anmelden lesbar)
      - name: Selbsttest der fertigen App
        run: |
          set -o pipefail
          if ! "dist/Börse EC Thun.app/Contents/MacOS/Börse EC Thun" --selftest 2>&1 | tee selftest.log; then
            echo "::error title=Selbsttest::$(tail -c 3500 selftest.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
      - name: ZIP erstellen
        run: |
          cd dist
          ditto -c -k --keepParent "Börse EC Thun.app" "Boerse-EC-Thun-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Boerse-EC-Thun-${{ matrix.arch }}
          path: dist/Boerse-EC-Thun-${{ matrix.arch }}.zip
      - name: An das Release hängen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Boerse-EC-Thun-${{ matrix.arch }}.zip
